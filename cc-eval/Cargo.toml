[package]
name = "cc-eval"
version = "0.1.0"
edition = "2021"

[lib]
name = "cc_eval"
path = "src/lib.rs"

[[bin]]
name = "cc-eval"
path = "src/main.rs"

[[bin]]
name = "pty-wrap"
path = "src/pty_wrap.rs"

[dependencies]
claude-code-rs = { path = "../../claude-code-rs", features = ["websocket"] }
dg-schemas = { path = "../crates/dg-schemas" }
md-db = { path = "../crates/md-db" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
git2 = "0.19"
rand = "0.8"
markdown-tui = { path = "../crates/markdown-tui" }
crossterm = "0.28"
dirs = "5"
portable-pty = "0.8"
reqwest = { version = "0.12", features = ["json"] }

[profile.dev.package."*"]
debug = false
strip = true

[profile.release]
lto = "thin"
