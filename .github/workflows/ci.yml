name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Cargo tests
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # RUSTC_WRAPPER=sccache comes from devenv.nix; this points it at the
      # GitHub Actions cache backend.
      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Build devenv shell
        shell: bash
        run: devenv shell true

      - name: Assert Cargo.lock is in sync with Cargo.toml
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Prebuild the SPA once; DG_SKIP_UI_BUILD stops build.rs from
      # rebuilding it for every profile (same trick as release.yml).
      - name: Build SPA
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run tests
        env:
          DG_SKIP_UI_BUILD: "1"
        run: cargo test --locked --workspace

  nix:
    name: Nix flake (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Pulls from decisiongraph.cachix.org; pushes built paths when the
      # CACHIX_AUTH_TOKEN secret is available (not on fork PRs).
      - uses: cachix/cachix-action@v17
        with:
          name: decisiongraph
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake check (evaluates all systems)
        if: matrix.system == 'x86_64-linux'
        run: nix flake check --all-systems

      - name: Assert ui/bun.nix is in sync with ui/bun.lock
        if: matrix.system == 'x86_64-linux'
        run: |
          nix run .#bun2nix -- -l ui/bun.lock -o /tmp/bun.nix
          diff -u ui/bun.nix /tmp/bun.nix

      - name: Build package
        run: nix build .#dg --print-build-logs

      - name: Smoke test binaries
        run: |
          ./result/bin/dg --version
          test -x ./result/bin/dg-mcp
