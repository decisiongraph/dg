name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust + e2e tests
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # RUSTC_WRAPPER=sccache comes from devenv.nix; this points it at the
      # GitHub Actions cache backend.
      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # FIXME: pinned to 2.2.x, same as devenv.yaml; 2.3 runs every git hook
      # on each `devenv shell` (https://github.com/cachix/devenv/issues/3184)
      - name: Install devenv
        shell: bash
        run: nix profile add github:cachix/devenv/v2.2.2

      - name: Build devenv shell
        shell: bash
        run: devenv shell true

      - name: Build UI
        run: |
          cd ui
          bun install --frozen-lockfile
          bun run build

      - name: Build dg binary (embeds fresh UI)
        run: DG_SKIP_UI_BUILD=1 cargo build -p dg-cli

      - name: Rust tests
        run: DG_SKIP_UI_BUILD=1 cargo test --workspace

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd ui && bunx playwright install --with-deps chromium

      # Browsers restored from cache still need the apt system deps
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd ui && bunx playwright install-deps chromium

      - name: e2e tests
        run: cd ui && bun run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7
