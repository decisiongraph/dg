name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Linux deps
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get install -y cmake libssl-dev pkg-config

      - name: Install Perl (Windows, for OpenSSL vendored build)
        if: runner.os == 'Windows'
        uses: shogo82148/actions-setup-perl@v1

      - name: Pre-build SPA for cross (bun not available inside container)
        if: matrix.use_cross
        run: cd ui && bun install && bun run build

      - name: Build (cross)
        if: matrix.use_cross
        env:
          DG_SKIP_UI_BUILD: "1"
        run: cross build --release --target ${{ matrix.target }} -p dg-cli -p dg-mcp

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} -p dg-cli -p dg-mcp

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TARGET=${{ matrix.target }}
          OUTDIR="dist/${TARGET}"
          mkdir -p "${OUTDIR}"
          cp "target/${TARGET}/release/dg" "${OUTDIR}/"
          cp "target/${TARGET}/release/dg-mcp" "${OUTDIR}/"
          tar -czf "dist/dg-${TARGET}.tar.gz" -C "dist" "${TARGET}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TARGET=${{ matrix.target }}
          OUTDIR="dist/${TARGET}"
          mkdir -p "${OUTDIR}"
          cp "target/${TARGET}/release/dg.exe" "${OUTDIR}/"
          cp "target/${TARGET}/release/dg-mcp.exe" "${OUTDIR}/"
          cd dist
          7z a "dg-${TARGET}.zip" "${TARGET}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dg-${{ matrix.target }}
          path: dist/dg-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update homebrew-tap formula
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          export VERSION="${TAG#v}"
          git clone "https://x-access-token:${GH_PAT}@github.com/decisiongraph/homebrew-tap.git" tap
          cd tap
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          python3 - <<'PYEOF'
          import re, os, hashlib

          def sha256(path):
              with open(path, "rb") as f:
                  return hashlib.sha256(f.read()).hexdigest()

          version = os.environ["VERSION"]
          with open("Formula/dg.rb") as f:
              content = f.read()

          content = re.sub(r'(version\s+")([^"]+)(")', rf'\g<1>{version}\g<3>', content)

          assets = [
              "dg-aarch64-apple-darwin.tar.gz",
              "dg-x86_64-apple-darwin.tar.gz",
              "dg-aarch64-unknown-linux-gnu.tar.gz",
              "dg-x86_64-unknown-linux-gnu.tar.gz",
          ]
          for asset in assets:
              digest = sha256(f"../dist/{asset}")
              content = re.sub(
                  r'(url\s+"[^"]*' + re.escape(asset) + r'[^"]*"\n\s+sha256\s+")[a-f0-9]+(")',
                  rf'\g<1>{digest}\g<2>',
                  content, flags=re.DOTALL
              )

          with open("Formula/dg.rb", "w") as f:
              f.write(content)
          PYEOF

          git add Formula/dg.rb
          git commit --no-gpg-sign -m "chore: update dg to ${TAG}"
          git push origin HEAD
