name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version-check:
    name: Assert tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare git tag with workspace version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "git tag: ${TAG} | Cargo.toml: ${CARGO_VERSION}"
          if [ "${TAG}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag v${TAG} does not match workspace version ${CARGO_VERSION}. Bump [workspace.package] version in Cargo.toml before tagging."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          # Fully static, no glibc needed (Alpine, scratch containers, old distros)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      # libz-sys otherwise links the runner's libz.so.1 dynamically on native
      # builds but bundles it under cross, so Linux tarballs differed (#34)
      - name: Link zlib statically (Linux)
        if: runner.os == 'Linux'
        run: echo "LIBZ_SYS_STATIC=1" >> "$GITHUB_ENV"

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Linux deps
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get install -y cmake libssl-dev pkg-config

      - name: Install Perl (Windows, for OpenSSL vendored build)
        if: runner.os == 'Windows'
        uses: shogo82148/actions-setup-perl@v1

      - name: Pre-build SPA for cross (bun not available inside container)
        if: matrix.use_cross
        run: cd ui && bun install && bun run build

      - name: Build (cross)
        if: matrix.use_cross
        env:
          DG_SKIP_UI_BUILD: "1"
        run: cross build --release --locked --target ${{ matrix.target }} -p dg-cli

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p dg-cli

      - name: Verify Linux linkage
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for bin in dg; do
            f="target/${TARGET}/release/${bin}"
            needed="$(readelf -d "$f" | grep NEEDED || true)"
            echo "${bin}: ${needed:-<none>}"
            if grep -q libz <<<"$needed"; then
              echo "::error::${bin} links libz dynamically"; exit 1
            fi
            if [[ "${TARGET}" == *-musl && -n "$needed" ]]; then
              echo "::error::${bin} (musl) is not statically linked"; exit 1
            fi
          done

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TARGET=${{ matrix.target }}
          OUTDIR="dist/${TARGET}"
          mkdir -p "${OUTDIR}"
          cp "target/${TARGET}/release/dg" "${OUTDIR}/"
          tar -czf "dist/dg-${TARGET}.tar.gz" -C "dist" "${TARGET}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TARGET=${{ matrix.target }}
          OUTDIR="dist/${TARGET}"
          mkdir -p "${OUTDIR}"
          cp "target/${TARGET}/release/dg.exe" "${OUTDIR}/"
          cd dist
          7z a "dg-${TARGET}.zip" "${TARGET}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dg-${{ matrix.target }}
          path: dist/dg-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived token scoped to the tap repo. Replaces GH_PAT: no
      # expiry to manage, and access is limited to decisiongraph/homebrew-tap.
      - name: Mint a scoped token for the tap
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: decisiongraph
          repositories: homebrew-tap

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update homebrew-tap formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          export VERSION="${TAG#v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/decisiongraph/homebrew-tap.git" tap
          cd tap
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git config user.name "${APP_SLUG}[bot]"

          python3 - <<'PYEOF'
          import re, os, hashlib, sys

          def sha256(path):
              with open(path, "rb") as f:
                  return hashlib.sha256(f.read()).hexdigest()

          def sub_once(pattern, repl, text, what, flags=0):
              new, n = re.subn(pattern, repl, text, flags=flags)
              if n != 1:
                  sys.exit(f"::error::expected exactly 1 match for {what}, got {n}. "
                           "Formula/dg.rb structure changed — refusing to publish a broken formula.")
              return new

          version = os.environ["VERSION"]
          with open("Formula/dg.rb") as f:
              content = f.read()

          # The download URLs interpolate #{version}, so only version + sha256 need updating.
          content = sub_once(r'(version\s+")([^"]+)(")', rf'\g<1>{version}\g<3>', content, "version")

          assets = [
              "dg-aarch64-apple-darwin.tar.gz",
              "dg-x86_64-apple-darwin.tar.gz",
              "dg-aarch64-unknown-linux-gnu.tar.gz",
              "dg-x86_64-unknown-linux-gnu.tar.gz",
          ]
          for asset in assets:
              digest = sha256(f"../dist/{asset}")
              content = sub_once(
                  r'(url\s+"[^"]*' + re.escape(asset) + r'[^"]*"\n\s+sha256\s+")[a-f0-9]+(")',
                  rf'\g<1>{digest}\g<2>',
                  content, f"sha256 of {asset}", flags=re.DOTALL,
              )

          # dg-mcp was removed in 0.1.18; tarballs only carry dg
          content = re.sub(r'\n[ \t]*bin\.install "dg-mcp"', "", content)

          with open("Formula/dg.rb", "w") as f:
              f.write(content)
          PYEOF

          git add Formula/dg.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${TAG}; nothing to commit."
            exit 0
          fi
          git commit --no-gpg-sign -m "chore: update dg to ${TAG}"
          git push origin HEAD

  # nix/dg-bin.nix reads nix/release.json. A tag can't hold hashes of its own
  # assets, so write them to main after the release; consumers tracking main
  # then get the new binaries on `devenv update dg`.
  update-nix-release:
    name: Update nix/release.json
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write release.json from SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT="$(jq -r .version nix/release.json)"
          # Re-running an old tag must not roll main back
          if [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "main already has ${CURRENT}, newer than ${VERSION}; skipping."
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -O "$RUNNER_TEMP/SHA256SUMS"
          nix/update-release.sh "$VERSION" "$RUNNER_TEMP/SHA256SUMS"

      - name: Commit to main
        run: |
          set -euo pipefail
          git add nix/release.json
          if git diff --cached --quiet; then
            echo "nix/release.json already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-gpg-sign -m "chore(nix): release.json for ${GITHUB_REF_NAME}"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
