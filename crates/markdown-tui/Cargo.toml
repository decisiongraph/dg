[package]
name = "markdown-tui"
version = "0.1.0"
edition = "2021"
description = "Render GitHub Flavored Markdown beautifully in terminal UIs with ratatui"
license = "MIT"
repository = "https://github.com/onnimonni/markdown-tui"
keywords = ["markdown", "ratatui", "tui", "terminal", "gfm"]
categories = ["command-line-interface", "text-processing", "rendering"]

[dependencies]
comrak = { version = "0.36", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ratatui = "0.29"
crossterm = "0.28"
latex2mathml = "0.2"
roxmltree = "0.20"
once_cell = "1.19"
unicode-width = "0.2"
unicode-segmentation = "1.11"
htmlescape = "0.3"
graphs-tui = { version = "0.4.0", optional = true }
ratatui-image = { version = "6", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif"] }

[dev-dependencies]
color-eyre = "0.6"
insta = "1"

[features]
default = []
images = ["dep:ratatui-image", "dep:image"]
diagrams = ["dep:graphs-tui"]
