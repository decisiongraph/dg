[package]
name = "dg-cli"
version = "0.1.0"
edition = "2021"
description = "DecisionGraph CLI — opinionated document management for decisions, policies, opportunities, and incidents"

[[bin]]
name = "dg"
path = "src/main.rs"

[dependencies]
dg-schemas = { path = "../dg-schemas" }
md-db = { workspace = true, features = ["git", "avatars"] }
dg-gherkin = { workspace = true }
markdown-tui = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
comrak = { version = "0.36", default-features = false }
crossterm = "0.28"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
regex = "1"
tiny_http = "0.12"
notify = "7"
opener = "0.7"

[dev-dependencies]
tempfile = "3"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dg-{ target }.tar.gz"
bin-dir = "{ bin }"
