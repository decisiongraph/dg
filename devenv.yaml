inputs:
  # FIXME: pinned to 2.2.x; 2.3 runs every git hook (clippy) on each
  # `devenv shell`. Unpin once https://github.com/cachix/devenv/issues/3184
  # is fixed (PR https://github.com/cachix/devenv/pull/3207).
  devenv:
    url: github:cachix/devenv/v2.2.2?dir=src/modules
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Provides the "stable" rust channel used by languages.rust.channel
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
